# Polybot configuration. Every field is documented. Defaults are conservative.

# ---- Market discovery ----
scanner:
  min_liquidity_usd: 5000
  min_volume_24h_usd: 2000
  rewards_only: true
  max_concurrent_markets: 25
  refresh_interval_sec: 60
  exclude_closing_within_hours: 2

# ---- Risk controls (hard ceilings — every new order is validated) ----
risk:
  max_notional_usd: 100.0
  max_per_market_usd: 20.0
  max_daily_loss_usd: 20.0
  # Kill-switch if lifetime PnL falls this far below its peak.
  max_drawdown_from_peak_usd: 30.0
  max_inventory_skew: 200.0
  min_order_usd: 5.0

# ---- Market maker (primary engine) ----
market_maker:
  enabled: true
  target_spread_bps: 50
  min_edge_over_mid_bps: 10
  requote_drift_bps: 25
  requote_interval_sec: 30
  quote_size_usd: 10.0
  join_if_wider_bps: 30
  tick_size: 0.001
  # Avellaneda-Stoikov inventory pricing. Shifts the reservation price by
  # -γ × inventory × σ². When long both sides move down; when short, up.
  use_inventory_skew: true
  inventory_risk_aversion: 0.05
  max_skew_shift: 0.02
  # Widen spread on volatile markets. adaptive_half = σ × multiplier.
  use_adaptive_spread: true
  sigma_to_spread_multiplier: 8.0

# ---- Intra-market YES+NO arbitrage ----
arbitrage:
  enabled: true
  min_profit_bps: 300
  max_size_per_arb_usd: 25.0
  taker_fee_bps: 200

# ---- Mean-reversion (opt-in) ----
mean_reversion:
  enabled: false
  window_sec: 300
  zscore_trigger: 1.5
  position_size_usd: 5.0
  max_hold_sec: 1800

# ---- Cross-market arbitrage (opt-in) ----
cross_market_arb:
  enabled: false

# ---- Circuit breakers ----
breaker:
  enabled: true
  max_errors_per_minute: 30
  max_feed_age_sec: 120.0
  # If >30% of markets move >500bps in a minute, pause.
  crash_bps_per_min: 500.0
  crash_market_share: 0.3
  max_api_failure_rate: 0.5
  cooldown_sec: 60

# ---- Volatility tracker ----
volatility:
  window_sec: 300
  min_samples: 8

# ---- Auto-research (every N hours) ----
research:
  enabled: true
  interval_hours: 6
  leaderboard_window: "7d"
  top_wallets: 50
  report_dir: state/research
  # If true AND we're NOT in live mode, the tuner may write config.yaml.
  auto_apply: false

# ---- Copy trading (opt-in, gated) ----
copy_trading:
  enabled: false
  max_wallets_to_follow: 5
  mirror_size_usd: 5.0
  min_wallet_pnl_usd: 10000.0
  allow_markets: []  # empty = mirror any market
  require_same_side: true

# ---- Auto-tuner ----
tuner:
  enabled: false
  evaluation_window_hours: 24
  target_fill_rate: 0.3
  learning_rate: 0.2

# ---- Laddered quotes ----
# Post multiple levels per side instead of one. Quadratic reward scoring
# rewards density near the mid; a ladder concentrates more orders there.
ladder:
  enabled: true
  levels: 3
  step_bps: 20
  size_decay: 0.7

# ---- Capital allocator (Kelly-lite) ----
# Sizes each market proportional to its expected reward score × liquidity.
allocator:
  enabled: true
  min_per_market_usd: 5.0

# ---- Book history recorder (enables backtesting) ----
history:
  enabled: true
  snapshot_interval_sec: 15
  retention_hours: 72
  db_path: state/book_history.sqlite

# ---- Position reconciler ----
reconciler:
  enabled: true
  interval_sec: 120
  auto_correct: true

# ---- Health endpoint (HTTP) ----
health:
  enabled: true
  port: 8080
  host: "0.0.0.0"
  max_tick_age_sec: 30

# ---- WebSocket feed (low-latency book updates) ----
websocket:
  enabled: true
  url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  ping_interval_sec: 10.0
  # REST fallback kicks in if the WS book is older than this.
  max_staleness_sec: 15.0

# ---- Observability ----
observability:
  prometheus_enabled: true
  prometheus_port: 9464
  # Optional webhook for critical events (e.g. Slack/Discord incoming webhook).
  alert_webhook_url: null
  json_logs: false

# ---- Loop ----
loop:
  tick_interval_sec: 2
  http_timeout_sec: 10
  retry_max_attempts: 5
