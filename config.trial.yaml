# Polybot trial config — 7-day paper-mode trial with 10-minute
# self-improvement cycles.
#
# Use with:  python -m polybot trial --days 7
#
# Every 10 minutes the bot:
#   1. Runs a research pass (top wallets, top markets, recommendations).
#   2. Runs the auto-tuner (reads the last 60 minutes of fills AND applies
#      any new research recommendations above the confidence threshold).
#   3. Writes a fresh snapshot JSON the dashboard reads on the next refresh.
#
# Every 3 hours it writes a full progress report (state/trial/progress-*.md).
#
# Defaults tuned for volume generation: tight spreads, small but frequent
# quotes, aggressive requote cadence. Hard risk caps keep any single bad
# day small.

scanner:
  min_liquidity_usd: 10000
  min_volume_24h_usd: 5000
  rewards_only: true
  max_concurrent_markets: 6
  refresh_interval_sec: 90
  exclude_closing_within_hours: 6
  # Skip dead markets where mid is pinned near 0 or 1 — no flow = no fills.
  min_mid_price: 0.15
  max_mid_price: 0.85

risk:
  max_notional_usd: 80
  max_per_market_usd: 15
  max_daily_loss_usd: 5          # stricter than old default for a $100 trial
  max_drawdown_from_peak_usd: 8
  max_inventory_skew: 50
  min_order_usd: 5

market_maker:
  enabled: true
  target_spread_bps: 30          # tighter start for more fills (was 40)
  min_edge_over_mid_bps: 8       # floor: still > fee drag (was 15)
  requote_drift_bps: 20
  requote_interval_sec: 30       # requote faster (was 45)
  quote_size_usd: 6
  join_if_wider_bps: 40
  tick_size: 0.001
  use_inventory_skew: true
  inventory_risk_aversion: 0.15
  max_skew_shift: 0.02
  use_adaptive_spread: true
  sigma_to_spread_multiplier: 10.0
  # Per-market fast-move guard. If a market's mid moved >200bps in the
  # last 60s, cancel our orders there and cool down for 60s.
  fast_move_bps: 200
  fast_move_lookback_sec: 60
  fast_move_cooldown_sec: 60

ladder:
  enabled: true              # on from day 1 in paper — easy to evaluate
  levels: 2
  step_bps: 25
  size_decay: 0.6

allocator:
  enabled: true
  min_per_market_usd: 5

arbitrage:
  enabled: true
  min_profit_bps: 350
  max_size_per_arb_usd: 20
  taker_fee_bps: 200

mean_reversion:
  enabled: false

cross_market_arb:
  enabled: false

breaker:
  enabled: true
  max_errors_per_minute: 20
  max_feed_age_sec: 60
  crash_bps_per_min: 400
  crash_market_share: 0.25
  max_api_failure_rate: 0.4
  cooldown_sec: 90

volatility:
  window_sec: 300
  min_samples: 8

history:
  enabled: true
  snapshot_interval_sec: 15
  retention_hours: 168
  db_path: state/book_history.sqlite

reconciler:
  enabled: true
  interval_sec: 180
  auto_correct: true

health:
  enabled: true
  port: 8080
  host: "127.0.0.1"           # laptop-safe: only bound to loopback
  max_tick_age_sec: 45

research:
  enabled: true
  interval_hours: 0.167       # every 10 minutes
  leaderboard_window: "7d"
  top_wallets: 50
  report_dir: state/research
  auto_apply: true            # safe in paper mode — tuner rewrites config

copy_trading:
  enabled: false

tuner:
  enabled: true
  evaluation_window_hours: 0.167  # fire every 10 minutes
  lookback_hours: 1.0             # but read 60 min of fills so stats aren't noisy
  target_fill_rate: 0.25
  learning_rate: 0.15
  min_orders_for_feedback: 10     # allow research-only changes when order count is low
  research_confidence_threshold: 0.5

websocket:
  enabled: true
  url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  ping_interval_sec: 10
  max_staleness_sec: 10

observability:
  prometheus_enabled: true
  prometheus_port: 9464
  alert_webhook_url: null
  json_logs: false

loop:
  tick_interval_sec: 2
  http_timeout_sec: 10
  retry_max_attempts: 5
