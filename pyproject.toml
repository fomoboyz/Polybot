[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polybot"
version = "0.1.0"
description = "Autonomous Polymarket trading bot optimized for volume, LP rewards, and arbitrage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "py-clob-client>=0.17.0",
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "rich>=13.7",
    "SQLAlchemy>=2.0",
]

[project.scripts]
polybot = "polybot.__main__:main"

[tool.setuptools.packages.find]
include = ["polybot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
